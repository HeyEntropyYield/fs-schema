name: publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner:
    uses: ./.github/workflows/runner.yml

  test:
    name: Test release candidate
    uses: ./.github/workflows/test.yml

  validate:
    name: Validate release
    needs: runner
    runs-on: ${{ needs.runner.outputs.runs-on }}
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-uv
      - run: ./run.sh uv:venv:sync @@ release:_check-ref --release
      - id: ver
        run: |
          status=$(./run.sh release:_check-version ${{ inputs.target }})
          printf '%s\n' "$status"
          case "$status" in
            *" unpublished "*) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *" exists "*) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected check-version: $status" >&2; exit 1 ;;
          esac
      - name: Require the matching version tag for PyPI
        if: inputs.target == 'pypi'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          ./run.sh release:_check-tag "$REF_NAME" --ref "$GITHUB_SHA"

  publish:
    name: Upload to ${{ inputs.target }}
    needs:
      - runner
      - test
      - validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ${{ needs.runner.outputs.runs-on }}
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.test.outputs.artifact-name }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  verify:
    name: Verify ${{ inputs.target }} installation
    needs:
      - runner
      - test
      - validate
      - publish
    if: >-
      always()
      && needs.test.result == 'success'
      && needs.validate.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ${{ needs.runner.outputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      - run: ./run.sh uv:venv:sync @@ release:_verify ${{ inputs.target }}

  release:
    name: Create GitHub Release
    needs:
      - runner
      - validate
      - verify
    if: inputs.target == 'pypi'
    runs-on: ${{ needs.runner.outputs.runs-on }}
    permissions:
      contents: write
    steps:
      - name: Create the release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --prerelease
