# Runner OS pin: versions/ubuntu via runner.yml (asserted by ./run.sh setup:check-image).

name: test

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Built distribution artifact name
        value: ${{ jobs.build-and-inspect-package.outputs.artifact-name }}
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    uses: ./.github/workflows/runner.yml

  check:
    name: Checks
    needs: runner
    runs-on: ${{ needs.runner.outputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-uv
      - run: ./run.sh uv:venv:sync @@ release:_check-ref @@ check

  # Lint and the wheel build share no inputs. Tests wait for both.
  build-and-inspect-package:
    name: Build and inspect package
    needs: runner
    runs-on: ${{ needs.runner.outputs.runs-on }}
    outputs:
      artifact-name: ${{ steps.baipp.outputs.artifact-name }}
      python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_job_matrix_value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./run.sh setup:check-image
      - id: baipp
        uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs:
      - runner
      - check
      - build-and-inspect-package
    runs-on: ${{ needs.runner.outputs.runs-on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-and-inspect-package.outputs.python-versions) }}
    env:
      COVERAGE_FILE: .coverage.${{ matrix.python-version }}
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-inspect-package.outputs.artifact-name }}
          path: dist
      - run: ./run.sh uv:venv:sync @@ ci:_test --installpkg dist/*.whl
      - if: matrix.python-version == '3.10' || matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sdist:
    name: Source distribution
    needs:
      - runner
      - check
      - build-and-inspect-package
    runs-on: ${{ needs.runner.outputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-inspect-package.outputs.artifact-name }}
          path: dist
      - run: ./run.sh uv:venv:sync @@ ci:_test --installpkg dist/*.tar.gz -- --no-cov

  coverage:
    name: Coverage
    needs:
      - runner
      - tests
    runs-on: ${{ needs.runner.outputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: ./run.sh uv:venv:sync @@ ci:_coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: coverage.json
          if-no-files-found: error
          retention-days: 1
